version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 77884455
      MYSQL_DATABASE: db_smartcity
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:mysql://db:3306/db_smartcity
      DB_USER: root
      DB_PASSWORD: 77884455

volumes:
  db_data: